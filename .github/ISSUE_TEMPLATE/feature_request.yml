name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Note any impact on the zero-knowledge design (what the server could learn).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
