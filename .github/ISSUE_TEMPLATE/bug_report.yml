name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real secrets, share links, API tokens or `config.toml` token blocks.**
        Security problems go to [private vulnerability reporting](https://github.com/gabltz/CipherDrop/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`curl https://<your-instance>/api/v1/version`, the image tag, or the commit"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Web UI, Server / API, CLI, Rust SDK, TypeScript/JavaScript SDK, Python SDK, Docker image, deploy/production (install.sh, cipherdropctl), Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, configuration (without tokens) and synthetic data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "e.g. `sudo cipherdropctl logs 100` or `cipherdropctl history`"
      render: text
