# CipherDrop behind Traefik v3 — generated by install.sh for __DOMAIN__.
# Dynamic configuration for the file provider (providers.file.directory).
# Adjust the entry point and certificate resolver names to your setup.
# If Traefik runs in Docker, install CipherDrop with --proxy-network <traefik network>
# so that the upstream below is http://cipherdrop:8080. Traefik sets
# X-Forwarded-For/-Proto itself. Keep access logs off (URLs contain share ids)
# and do not add a buffering middleware (it can spool bodies to disk).

http:
  routers:
    cipherdrop:
      rule: "Host(`__DOMAIN__`)"
      entryPoints: [websecure]
      service: cipherdrop
      tls:
        certResolver: letsencrypt
  services:
    cipherdrop:
      loadBalancer:
        servers:
          - url: "http://__UPSTREAM__"
