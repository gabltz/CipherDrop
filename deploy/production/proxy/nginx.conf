# CipherDrop behind nginx — generated by install.sh for __DOMAIN__.
# Install:  cp __FILE__ /etc/nginx/sites-available/cipherdrop
#           ln -s /etc/nginx/sites-available/cipherdrop /etc/nginx/sites-enabled/
#           set the certificate paths below (e.g. certbot --nginx -d __DOMAIN__), then
#           nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Share ids are in URLs: no access log for this site.
    access_log off;
    client_max_body_size 2m;

    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Stream bodies; never write ciphertext to temp files.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
