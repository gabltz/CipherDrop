# CipherDrop behind Apache httpd — generated by install.sh for __DOMAIN__.
# Needs: a2enmod proxy proxy_http headers ssl
# Install:  cp __FILE__ /etc/apache2/sites-available/cipherdrop.conf
#           set the certificate paths below, then: a2ensite cipherdrop && systemctl reload apache2

<VirtualHost *:80>
    ServerName __DOMAIN__
    Redirect permanent / https://__DOMAIN__/
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem

    # Share ids are in URLs: do not log requests for this site.
    CustomLog /dev/null common
    LimitRequestBody 2097152

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://__UPSTREAM__/ flushpackets=on
    ProxyPassReverse / http://__UPSTREAM__/
</VirtualHost>
