# Nginx reverse proxy for CipherDrop listening on 127.0.0.1:8080.
# CipherDrop config: trust_forwarded_headers = true, trusted_proxies = ["127.0.0.1/32"]

log_format cipherdrop_privacy '$time_iso8601 $status $request_method $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name paste.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paste.example.com;

    ssl_certificate     /etc/letsencrypt/live/paste.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paste.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cipherdrop.log cipherdrop_privacy;   # no URIs (share ids)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # no client_body_temp files
        proxy_buffering off;           # no proxy_temp files with ciphertext
        proxy_read_timeout 30s;
    }
}
