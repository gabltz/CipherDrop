[package]
name = "cipherdrop-cli"
description = "CipherDrop command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cipherdrop"
path = "src/main.rs"

[dependencies]
cipherdrop-sdk = { path = "../sdk" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
secrecy = "0.10"
zeroize = "1.9"
humantime = "2"
rpassword = "7"

[dev-dependencies]
cipherdrop-server = { path = "../server", default-features = false, features = ["sqlite"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
