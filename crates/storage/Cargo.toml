[package]
name = "cipherdrop-storage"
description = "CipherDrop storage engines: bounded RAM-only store and optional SQLite persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
cipherdrop-protocol = { path = "../protocol", version = "0.1.0", default-features = false }
parking_lot = "0.13"
subtle = "2.6"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"], optional = true }

[dev-dependencies]
proptest = "1.12"
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "store"
harness = false
