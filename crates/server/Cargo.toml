[package]
name = "cipherdrop-server"
description = "CipherDrop zero-knowledge secret sharing server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cipherdrop-server"
path = "src/main.rs"

[features]
default = ["sqlite", "tls"]
sqlite = ["cipherdrop-storage/sqlite"]
tls = ["dep:tokio-rustls", "dep:rustls"]

[dependencies]
cipherdrop-protocol = { path = "../protocol", version = "0.1.0", default-features = false, features = ["openapi"] }
cipherdrop-storage = { path = "../storage", version = "0.1.0", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "matched-path", "original-uri"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["timeout", "limit", "cors", "set-header", "compression-gzip", "compression-br"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
utoipa = "6"
toml = "1"
governor = "0.10"
ipnet = { version = "2", features = ["serde"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
getrandom = "0.4"
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"
parking_lot = "0.13"
secrecy = "0.10"
zeroize = "1.9"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "mm"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
cipherdrop-protocol = { path = "../protocol", version = "0.1.0" }
